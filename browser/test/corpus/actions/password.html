<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Account: change password</title>
  </head>
  <body>
    <h1>Change password</h1>
    <form id="pw" action="/actions/account/password" method="post">
      <label>Current password <input type="password" name="current" autocomplete="current-password" value="old-password-1" /></label>
      <label>New password <input id="new" type="password" name="new" autocomplete="new-password" value="new-password-2" /></label>
      <button id="change" type="submit">Change password</button>
    </form>
  </body>
</html>
