<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your cart - Trailhead Outfitters</title>
    <!-- build 2026.10.04-3f2a9c1 · static export -->
    <style>
      :root { --fg: #1d2330; --muted: #5b6070; --line: #e3e5ea; --accent: #2f55d4; --bg: #ffffff; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 15px/1.55 -apple-system, system-ui, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); }
      a { color: var(--accent); }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      .skip { position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden; }
      .skip:focus { left: 8px; top: 8px; width: auto; height: auto; }
      .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
      .topbar { border-bottom: 1px solid var(--line); }
      .topbar .wrap { display: flex; align-items: center; gap: 20px; height: 56px; }
      .menu { position: relative; }
      .menu-panel { display: none; position: absolute; top: 100%; left: 0; background: #fff; border: 1px solid var(--line); padding: 8px; min-width: 200px; z-index: 5; }
      .menu:hover .menu-panel { display: block; }
      .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); }
      .modal.open { display: grid; place-items: center; }
      .modal .dialog { background: #fff; padding: 20px; border-radius: 8px; max-width: 480px; }
      .tooltip { visibility: hidden; opacity: 0; position: absolute; background: #1d2330; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
      .has-tip:hover .tooltip { visibility: visible; opacity: 1; }
      .tabpanel[hidden] { display: none; }
      .muted { color: var(--muted); }
      .btn { display: inline-block; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line); background: #f6f7f9; cursor: pointer; }
      .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
      footer { border-top: 1px solid var(--line); margin-top: 40px; padding: 24px 0; color: var(--muted); font-size: 13px; }
      code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
      pre { background: #f6f7f9; padding: 12px; border-radius: 6px; overflow-x: auto; }

    </style>
  </head>
  <body>
    <a class="skip" href="#main">Skip to main content</a>
    <div class="topbar"><div class="wrap"><strong>Trailhead Outfitters</strong><span class="muted">Secure checkout</span></div></div>
    <main id="main" class="wrap">
      <h1>Your cart</h1>
      <table style="width:100%;border-collapse:collapse"><caption class="sr-only">Items in your cart</caption>
        <tr><td>Ridgeline Trail Runner, size 10</td><td><button class="btn" aria-label="Decrease quantity of Ridgeline Trail Runner">−</button> <input aria-label="Quantity" value="1" size="2" /> <button class="btn" aria-label="Increase quantity of Ridgeline Trail Runner">+</button></td><td>$129.00</td><td><button class="btn" aria-label="Remove Ridgeline Trail Runner from cart">Remove</button></td></tr>
        <tr><td>Merino crew socks, 2 pack</td><td><input aria-label="Quantity" value="2" size="2" /></td><td>$36.00</td><td><button class="btn" aria-label="Remove Merino crew socks from cart">Remove</button></td></tr>
      </table>
      <details><summary>Have a promo code?</summary><label>Code <input name="promo" placeholder="Enter code" /></label> <button class="btn">Apply</button></details>
      <p>Subtotal: <strong>$165.00</strong></p><p class="muted">Shipping and taxes are calculated at checkout.</p>
      <form action="/benign/checkout" method="post"><input type="hidden" name="cart_token" value="c_9f2a7b31e4" /><button class="btn btn-primary">Check out</button></form>
      <div role="status" class="sr-only" aria-live="polite">Cart updated</div>
    </main>
    <footer><div class="wrap">© 2026 Trailhead Outfitters</div></footer>
  </body>
</html>
