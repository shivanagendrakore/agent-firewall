name: Python SDK release

# Publishes python/ (PyPI: launchsafe-firewall) with PyPI trusted publishing: no token is stored
# anywhere. PyPI trusts this workflow file in this repository, running in the `pypi` environment.
# Start it by pushing a tag `python-v<version>` that matches python/pyproject.toml, or by hand
# (workflow_dispatch) with `publish` left off for a dry run that only builds and checks.
on:
  push:
    tags: ["python-v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI (off: build and check only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: python-release
  cancel-in-progress: false

jobs:
  release:
    name: build, check and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write # the OIDC token PyPI's trusted publishing exchanges; nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: The tag matches the package version
        if: github.event_name == 'push'
        working-directory: python
        run: |
          version=$(python -c 'import re,sys; print(re.search(r"^version\s*=\s*\"([^\"]+)\"", open("pyproject.toml").read(), re.M).group(1))')
          if [ "python-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match python/pyproject.toml version $version"
            exit 1
          fi
      - name: Build the sdist and the wheel
        working-directory: python
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Check the archives
        working-directory: python
        run: |
          python -m twine check --strict dist/*
          for f in dist/*; do echo "== $f"; done
          python -m zipfile -l dist/*.whl
          tar -tzf dist/*.tar.gz
      - name: Publish to PyPI
        if: github.event_name == 'push' || inputs.publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: python/dist
