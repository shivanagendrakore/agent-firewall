name: Python SDK

# python/ is its own package (PyPI: launchsafe-firewall). These jobs run when it
# changes, and also when the firewall code or the conformance vectors it is
# tested against change (src/, conformance/, the Node build files), because the
# Python suite replays every conformance vector against the real engine.
on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - "src/**"
      - "conformance/**"
      - "test/api/e2e-python.test.ts"
      - "test/api/e2e_python_guard.py"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/python.yml"
  pull_request:
    branches: [main]
    paths:
      - "python/**"
      - "src/**"
      - "conformance/**"
      - "test/api/e2e-python.test.ts"
      - "test/api/e2e_python_guard.py"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/python.yml"

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: python

jobs:
  test:
    name: tests (Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Python. The Pydantic AI extra needs 3.11 or later, so it is left out
          # here and its tests skip.
          - python: "3.10"
            extras: dev,openai-agents,langgraph,claude-agent-sdk,google-adk
            static: false
          # Every extra except CrewAI (it does not install beside Google ADK; see the crewai job).
          # mypy needs every integration's types, so the static checks run here; the CrewAI files are
          # excluded in pyproject.toml and type-checked in the crewai job, where crewai is installed.
          - python: "3.13"
            extras: dev,openai-agents,langgraph,claude-agent-sdk,pydantic-ai,google-adk
            static: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      # Node and the compiled firewall (dist-conformance/), for the conformance vectors the Python suite replays.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Install the firewall's Node dependencies
        working-directory: .
        run: npm ci
      - name: Build the firewall for the conformance vectors (dist-conformance)
        working-directory: .
        run: npx tsc -p tsconfig.conformance.json
      - name: Install the SDK with its extras
        env:
          EXTRAS: ${{ matrix.extras }}
        run: python -m venv .venv && .venv/bin/pip install -e ".[${EXTRAS}]"
      - name: Tests
        env:
          # The conformance vectors fail instead of skipping when node or dist-conformance is missing.
          LAUNCHSAFE_FIREWALL_CONFORMANCE: require
        run: .venv/bin/pytest
      # The SDK against the real sidecar (test/api/e2e-python.test.ts), with the venv made above.
      - name: Python SDK against the real sidecar
        working-directory: .
        env:
          LAUNCHSAFE_FIREWALL_PY_VENV: ${{ github.workspace }}/python/.venv
        run: npx vitest run test/api/e2e-python.test.ts
      - name: Type check (mypy --strict)
        if: ${{ matrix.static }}
        run: .venv/bin/mypy --strict
      - name: Lint (ruff check)
        if: ${{ matrix.static }}
        run: .venv/bin/ruff check .
      - name: Format (ruff format --check)
        if: ${{ matrix.static }}
        run: .venv/bin/ruff format --check .

  crewai:
    name: CrewAI tests (own environment)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install the SDK with the CrewAI extra
        run: python -m venv .venv-crewai && .venv-crewai/bin/pip install -e ".[dev,crewai]"
      - name: Tests
        run: .venv-crewai/bin/pytest tests/test_crewai.py
      # The CrewAI files are excluded from the main job's mypy run (pyproject.toml); naming them checks them here.
      - name: Type check the CrewAI files (mypy --strict)
        run: >-
          .venv-crewai/bin/mypy --strict
          src/launchsafe_firewall/integrations/crewai.py
          tests/test_crewai.py
          examples/crewai_example.py
