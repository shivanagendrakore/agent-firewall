name: Secret scan

# Secret scan of the working tree with the repository's .gitleaks.toml (narrow, commented exceptions for the
# fake values this security tool carries on purpose). It covers all three parts (the root, browser/ and
# python/), so it runs on every push and pull request, with no paths filter, while ci.yml, browser.yml and
# python.yml each run only for their own part. The gitleaks CLI is free and needs no account. It is fetched as
# a pinned release and checked against its published SHA-256, instead of gitleaks/gitleaks-action, which asks
# organization repositories for a license key. No GitHub feature or setting is involved. The file is not named
# secrets.yml because that name is on the firewall's own list of credential files (src/engine/paths.ts), so
# the firewall, and other tools that skip secret-like files, would treat this workflow as one.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # gitleaks_8.30.1_linux_x64.tar.gz, from gitleaks_8.30.1_checksums.txt of that release.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install gitleaks (pinned release, checksum verified)
        shell: bash
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/gitleaks"
          mkdir -p "${dir}"
          curl -fsSL --retry 3 -o "${dir}/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${dir}/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "${dir}/gitleaks.tar.gz" -C "${dir}" gitleaks
          "${dir}/gitleaks" version
      - name: Scan for secrets
        run: '"${RUNNER_TEMP}/gitleaks/gitleaks" dir . --config .gitleaks.toml --redact --no-banner --exit-code 1'
