[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "launchsafe-firewall"
version = "0.1.0"
description = "Python SDK for the LaunchSafe Agent Firewall's local API sidecar"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "LaunchSafe" }]
keywords = ["ai-agents", "security", "firewall", "tool-calling", "guardrails"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://github.com/shivanagendrakore/agent-firewall"
Documentation = "https://github.com/shivanagendrakore/agent-firewall/blob/main/docs/api.md"
Repository = "https://github.com/shivanagendrakore/agent-firewall/tree/main/python"
Issues = "https://github.com/shivanagendrakore/agent-firewall/issues"

[project.optional-dependencies]
# Lower bounds are the oldest releases the test suite passes with (13 Oct 2026). openai-agents stays at 0.20:
# crewai needs openai<3 and openai-agents 0.21+ needs openai>=3, so an install with both extras gets 0.20.
openai-agents = ["openai-agents>=0.20"]
langgraph = ["langgraph>=1.1.6", "langchain-core>=1.3"]
claude-agent-sdk = ["claude-agent-sdk>=0.2.82"]
pydantic-ai = ["pydantic-ai-slim>=2.55"]
google-adk = ["google-adk>=2.9"]
crewai = ["crewai>=1.15.22"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "mypy>=1.13",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/launchsafe_firewall"]

# The source distribution carries the package and its legal files only: no tests, examples or caches.
[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "examples"]
# The CrewAI extra does not install beside Google ADK, so the environment that checks everything else has
# no crewai. Its three files are left out of the default run and checked strictly, with crewai installed,
# by naming them (an explicitly named file is checked even when it matches `exclude`):
#   mypy --strict src/launchsafe_firewall/integrations/crewai.py tests/test_crewai.py examples/crewai_example.py
# (the "CrewAI tests" job in .github/workflows/python.yml).
exclude = [
  '(^|/)src/launchsafe_firewall/integrations/crewai\.py$',
  '(^|/)tests/test_crewai\.py$',
  '(^|/)examples/crewai_example\.py$',
]

[[tool.mypy.overrides]]
module = ["agents.*", "langgraph.*", "langchain_core.*"]
follow_untyped_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PT", "RET", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PT018"]
