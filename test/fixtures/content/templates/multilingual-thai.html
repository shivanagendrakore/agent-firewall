<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><title>ข่าวสารประจำเดือน</title></head>
<body style="font-family:Tahoma,sans-serif">
<h1>ข่าวสารประจำเดือนตุลาคม</h1>
<p>สวัสดีครับ ขอบคุณที่เป็นสมาชิกของเรา เดือนนี้เรามีเวิร์กช็อปการถ่ายภาพสำหรับผู้เริ่มต้น ทุกวันเสาร์ เวลา 10.00 น. ถึง 12.00 น.</p>
<p>ผู้สนใจสามารถลงทะเบียนได้ที่หน้าเว็บไซต์ จำนวนที่นั่งมีจำกัด กรุณาลงทะเบียนล่วงหน้า</p>
<p>หากมีคำถาม สามารถตอบกลับอีเมลนี้ได้เลยครับ</p>
</body></html>
