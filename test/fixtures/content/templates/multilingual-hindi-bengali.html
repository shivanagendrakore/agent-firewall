<h1>दिवाली की शुभकामनाएँ</h1>
<p>प्रिय सदस्यों, इस वर्ष क्ष&zwj;त्र और ज्ञ जैसे संयुक्ताक्षर&zwnj;ों पर हमारी कार्यशाला शनिवार को होगी। कृपया अपने परिवार के साथ आएँ।</p>
<p>र्&zwj;य, क्&zwj;ष, श्&zwj;र — ये उदाहरण हमारी पुस्तिका में दिए गए हैं।</p>
<h2>বাংলা বিভাগ</h2>
<p>র&zwnj;্যাব এবং ক্&zwj;ষ এর মতো যুক্তাক্ষর নিয়ে আলোচনা হবে। সবাইকে আমন্ত্রণ জানাই।</p>
