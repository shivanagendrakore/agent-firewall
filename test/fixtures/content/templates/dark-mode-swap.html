<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><meta name="supported-color-schemes" content="light dark"><title>Product update</title>
<style>:root{color-scheme:light dark;supported-color-schemes:light dark}
.dark-img{display:none;max-height:0;overflow:hidden;mso-hide:all}
@media (prefers-color-scheme:dark){.light-img{display:none!important}.dark-img{display:block!important;max-height:none!important;overflow:visible!important}.body{background:#0b0b0b!important}.text{color:#f5f5f5!important}}
[data-ogsc] .light-img{display:none!important}[data-ogsc] .dark-img{display:block!important}
</style></head>
<body class="body" style="margin:0;background:#ffffff">
<table width="100%" role="presentation"><tr><td align="center" style="padding:24px">
<img class="light-img" src="https://cdn.example.com/logo-light.png" width="120" alt="Example">
<div class="dark-img"><img src="https://cdn.example.com/logo-dark.png" width="120" alt="Example"></div>
<h1 class="text" style="font-family:Georgia,serif;color:#111">Offline mode is here</h1>
<p class="text" style="font-family:Georgia,serif;color:#333;max-width:480px">Edit documents on a plane, on a train, or in a field. Changes sync the moment you are back online, and nothing is lost if two people edit the same paragraph.</p>
<div class="light-img"><a href="https://www.example.com/offline" style="color:#0b57d0">See how it works</a></div>
<div class="dark-img"><a href="https://www.example.com/offline" style="color:#a8c7fa">See how it works</a></div>
</td></tr></table></body></html>
